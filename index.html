<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>Countdown</title>

    <style>
        :root {
            --bg1: #0b1020;
            --bg2: #1a1446;
            --card: rgba(255, 255, 255, 0.07);
            --border: rgba(255, 255, 255, 0.12);
            --tile: rgba(255, 255, 255, 0.08);
            --text: #f8fafc;
            --muted: #a5b0c5;
            --accent: #8b5cf6;
            --accent2: #06b6d4;
        }

        [data-theme="light"] {
            --bg1: #eef2ff;
            --bg2: #fce7f3;
            --card: rgba(255, 255, 255, 0.8);
            --border: rgba(15, 23, 42, 0.08);
            --tile: rgba(15, 23, 42, 0.05);
            --text: #0f172a;
            --muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(160deg, var(--bg1), var(--bg2)) fixed;
            color: var(--text);
            min-height: 100dvh;
            padding-top: env(safe-area-inset-top);
        }

        /* ---------- Header ---------- */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 560px;
            margin: 0 auto;
            padding: 1rem 1.1rem 0.5rem;
        }

        .app-header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-size: 1.15rem;
            cursor: pointer;
        }

        /* ---------- Layout ---------- */
        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 0.5rem 1rem calc(6rem + env(safe-area-inset-bottom));
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* ---------- Countdown cards ---------- */
        .countdown-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 1.1rem;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .countdown-card h3 {
            font-size: 1rem;
            font-weight: 600;
        }

        .timer {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
        }

        .tile {
            background: var(--tile);
            border-radius: 16px;
            padding: 0.7rem 0.2rem;
            text-align: center;
        }

        .tile .num {
            display: block;
            font-size: clamp(1.4rem, 7vw, 1.9rem);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .tile .label {
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
        }

        .progress {
            height: 8px;
            background: var(--tile);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            border-radius: 99px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            transition: width 0.6s ease;
        }

        .meta {
            display: flex;
            justify-content: space-between;
            gap: 0.5rem;
            margin-top: 0.6rem;
            font-size: 0.75rem;
            color: var(--muted);
        }

        /* The first card is the big "hero" countdown */
        .countdown-card:first-child {
            padding: 1.4rem 1.2rem;
            background:
                linear-gradient(135deg, rgba(139, 92, 246, 0.35), rgba(6, 182, 212, 0.25)),
                var(--card);
        }

        .countdown-card:first-child h3 {
            font-size: 1.25rem;
        }

        .countdown-card:first-child .tile {
            padding: 1rem 0.2rem;
        }

        .countdown-card:first-child .tile .num {
            font-size: clamp(1.8rem, 10vw, 2.8rem);
        }

        /* ---------- Floating add button ---------- */
        .fab {
            position: fixed;
            right: 1.25rem;
            bottom: calc(1.25rem + env(safe-area-inset-bottom));
            width: 58px;
            height: 58px;
            border: none;
            border-radius: 50%;
            font-size: 1.8rem;
            color: white;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            box-shadow: 0 8px 24px rgba(139, 92, 246, 0.45);
            cursor: pointer;
        }

        /* ---------- Bottom sheet (form) ---------- */
        .backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
        }

        .sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            max-width: 560px;
            margin: 0 auto;
            padding: 1.25rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom));
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 24px 24px 0 0;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        body.sheet-open .backdrop {
            opacity: 1;
            pointer-events: auto;
        }

        body.sheet-open .sheet {
            transform: translateY(0);
        }

        .sheet h2 {
            font-size: 1.15rem;
            margin-bottom: 0.9rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        label {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            font-size: 0.8rem;
            color: var(--muted);
        }

        input {
            padding: 0.8rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--tile);
            color: var(--text);
            font-size: 1rem;
            /* 16px stops iOS from zooming in */
        }

        .btn {
            padding: 0.9rem;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            cursor: pointer;
        }

        .card-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.5rem;
            margin-bottom: 0.9rem;
        }

        .countdown-card:first-child .card-head {
            margin-bottom: 1.1rem;
        }

        .card-actions {
            display: flex;
            gap: 0.35rem;
            flex-shrink: 0;
        }

        .mini-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: var(--tile);
            font-size: 0.95rem;
            cursor: pointer;
        }

        .empty {
            text-align: center;
            color: var(--muted);
            padding: 3rem 1rem;
            line-height: 1.6;
        }

        .form-error {
            min-height: 1.1em;
            font-size: 0.8rem;
            color: #f87171;
        }

        /* ---------- Icons ---------- */
        .icon {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo .icon {
            width: 24px;
            height: 24px;
            color: var(--accent2);
        }

        .icon-btn,
        .mini-btn,
        .fab {
            display: grid;
            place-items: center;
        }

        .mini-btn {
            color: var(--muted);
            transition: color 0.2s, background 0.2s;
        }

        .mini-btn:hover {
            color: var(--text);
        }

        .mini-btn[data-action="delete"]:hover {
            color: #f87171;
        }

        .fab .icon {
            width: 26px;
            height: 26px;
            stroke-width: 2.5;
        }

        /* Show the moon in dark mode, the sun in light mode */
        .icon-sun {
            display: none;
        }

        [data-theme="light"] .icon-sun {
            display: block;
        }

        [data-theme="light"] .icon-moon {
            display: none;
        }

        /* ---------- Animations ---------- */
        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes flip {
            from {
                opacity: 0.3;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .countdown-card {
            animation: cardIn 0.4s ease both;
        }

        .num.flip {
            animation: flip 0.25s ease;
        }

        .fab:active,
        .btn:active {
            transform: scale(0.95);
        }

        .countdown-card.done .progress-bar {
            background: #22c55e;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
    <script>
        try {
            const saved = localStorage.getItem("theme");
            const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
            document.documentElement.dataset.theme = saved || (prefersLight ? "light" : "dark");
        } catch (err) { }
    </script>
</head>

<body>
    <header class="app-header">
        <div class="logo">
            <svg class="icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 7v5l3 2" />
            </svg>
            <h1>Countdown</h1>
        </div>
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme">
            <svg class="icon icon-moon" viewBox="0 0 24 24">
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
            <svg class="icon icon-sun" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="4" />
                <path
                    d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
        </button>
    </header>

    <main class="container">
        <!-- Countdown cards are inserted here. The first one is the hero. -->
        <section id="countdown-list" class="list"></section>
    </main>

    <button id="open-sheet" class="fab" aria-label="Add countdown">
        <svg class="icon" viewBox="0 0 24 24">
            <path d="M12 5v14M5 12h14" />
        </svg>
    </button>

    <div id="backdrop" class="backdrop"></div>
    <section class="sheet" aria-label="Countdown form">
        <h2 id="sheet-title">New countdown</h2>
        <form id="countdown-form">
            <input type="text" id="title" placeholder="Title (e.g. Exam)" maxlength="40" required />
            <label>Start date
                <input type="date" id="start" required />
            </label>
            <label>End date
                <input type="date" id="end" required />
            </label>
            <p id="form-error" class="form-error"></p>
            <button type="submit" id="submit-btn" class="btn">Add countdown</button>
        </form>
    </section>

    <script>
        // ---------- Storage ----------
        const STORAGE_KEY = "countdowns-v1";
        let countdowns = loadCountdowns();
        let editingId = null; // null = adding, a number = editing that countdown

        function loadCountdowns() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (err) {
                return [];
            }
        }

        function saveCountdowns() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(countdowns));
            } catch (err) {
                console.error("Could not save", err);
            }
        }

        // ---------- Elements ----------
        const listEl = document.getElementById("countdown-list");
        const form = document.getElementById("countdown-form");
        const titleInput = document.getElementById("title");
        const startInput = document.getElementById("start");
        const endInput = document.getElementById("end");
        const errorEl = document.getElementById("form-error");
        const sheetTitle = document.getElementById("sheet-title");
        const submitBtn = document.getElementById("submit-btn");

        // ---------- Helpers ----------
        function pad(n) {
            return String(n).padStart(2, "0");
        }

        function dateToTimestamp(dateString) {
            return new Date(dateString + "T00:00:00").getTime();
        }

        function timestampToDate(ts) {
            const d = new Date(ts);
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        }

        function formatDate(ts) {
            return new Date(ts).toLocaleDateString("en-IN", {
                day: "numeric", month: "short", year: "numeric"
            });
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        function getTimeLeft(end) {
            const diff = Math.max(0, end - Date.now());
            return {
                done: diff === 0,
                days: Math.floor(diff / 86400000),
                hours: Math.floor(diff / 3600000) % 24,
                minutes: Math.floor(diff / 60000) % 60,
                seconds: Math.floor(diff / 1000) % 60
            };
        }

        function getProgress(start, end) {
            const total = end - start;
            if (total <= 0) return 100;
            const percent = ((Date.now() - start) / total) * 100;
            return Math.min(100, Math.max(0, percent));
        }

        // Upcoming first (nearest end date on top), completed ones last
        function getSorted() {
            const now = Date.now();
            return [...countdowns].sort((a, b) => {
                const aDone = a.end <= now;
                const bDone = b.end <= now;
                if (aDone !== bDone) return aDone ? 1 : -1;
                return a.end - b.end;
            });
        }

        // ---------- Render cards ----------
        function render() {
            if (countdowns.length === 0) {
                listEl.innerHTML = `
      <div class="empty">
        <p>No countdowns yet.</p>
        <p>Tap the <strong>+</strong> button to add your first one.</p>
      </div>`;
                return;
            }

            listEl.innerHTML = getSorted().map(c => `
    <article class="countdown-card" data-id="${c.id}">
      <div class="card-head">
        <h3>${escapeHtml(c.title)}</h3>
        <div class="card-actions">
          <button class="mini-btn" data-action="edit" aria-label="Edit">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          </button>
          <button class="mini-btn" data-action="delete" aria-label="Delete">
            <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
          </button>
        </div>
      </div>
      <div class="timer">
        <div class="tile"><span class="num" data-f="days">00</span><span class="label">Days</span></div>
        <div class="tile"><span class="num" data-f="hours">00</span><span class="label">Hours</span></div>
        <div class="tile"><span class="num" data-f="minutes">00</span><span class="label">Min</span></div>
        <div class="tile"><span class="num" data-f="seconds">00</span><span class="label">Sec</span></div>
      </div>
      <div class="progress"><div class="progress-bar" data-f="bar"></div></div>
      <div class="meta">
        <span data-f="status"></span>
        <span>Ends ${formatDate(c.end)}</span>
      </div>
    </article>
  `).join("");
        }

        // ---------- Update numbers every second ----------
        function tick() {
            countdowns.forEach(c => {
                const card = listEl.querySelector(`[data-id="${c.id}"]`);
                if (!card) return;
                const t = getTimeLeft(c.end);
                const percent = getProgress(c.start, c.end);

                card.querySelector('[data-f="days"]').textContent = pad(t.days);
                card.querySelector('[data-f="hours"]').textContent = pad(t.hours);
                card.querySelector('[data-f="minutes"]').textContent = pad(t.minutes);

                // Seconds: only update (and animate) when the value actually changes
                const sec = card.querySelector('[data-f="seconds"]');
                const secText = pad(t.seconds);
                if (sec.textContent !== secText) {
                    sec.textContent = secText;
                    sec.classList.remove("flip");
                    void sec.offsetWidth; // forces the browser to restart the animation
                    sec.classList.add("flip");
                }

                card.querySelector('[data-f="bar"]').style.width = percent + "%";
                card.classList.toggle("done", t.done);
                card.querySelector('[data-f="status"]').textContent =
                    t.done ? "Completed" : Math.floor(percent) + "% passed";
            });
        }

        function refresh() {
            render();
            tick();
        }

        // ---------- Bottom sheet ----------
        function openSheet(id = null) {
            editingId = id;
            errorEl.textContent = "";

            if (id === null) {
                form.reset();
                startInput.value = timestampToDate(Date.now()); // default start = today
                sheetTitle.textContent = "New countdown";
                submitBtn.textContent = "Add countdown";
            } else {
                const c = countdowns.find(item => item.id === id);
                titleInput.value = c.title;
                startInput.value = timestampToDate(c.start);
                endInput.value = timestampToDate(c.end);
                sheetTitle.textContent = "Edit countdown";
                submitBtn.textContent = "Save changes";
            }
            document.body.classList.add("sheet-open");
        }

        function closeSheet() {
            document.body.classList.remove("sheet-open");
            editingId = null;
        }

        document.getElementById("open-sheet").addEventListener("click", () => openSheet());
        document.getElementById("backdrop").addEventListener("click", closeSheet);

        // ---------- Add / edit ----------
        form.addEventListener("submit", (e) => {
            e.preventDefault();

            const title = titleInput.value.trim();
            const start = dateToTimestamp(startInput.value);
            const end = dateToTimestamp(endInput.value);

            if (!title) return;
            if (end <= start) {
                errorEl.textContent = "End date must be after the start date.";
                return;
            }

            if (editingId !== null) {
                const c = countdowns.find(item => item.id === editingId);
                c.title = title;
                c.start = start;
                c.end = end;
            } else {
                countdowns.push({ id: Date.now(), title, start, end });
            }

            saveCountdowns();
            refresh();
            closeSheet();
        });

        // ---------- Edit / delete buttons (event delegation) ----------
        listEl.addEventListener("click", (e) => {
            const btn = e.target.closest("[data-action]");
            if (!btn) return;

            const id = Number(btn.closest(".countdown-card").dataset.id);

            if (btn.dataset.action === "edit") {
                openSheet(id);
            }

            if (btn.dataset.action === "delete") {
                const c = countdowns.find(item => item.id === id);
                if (confirm(`Delete "${c.title}"?`)) {
                    countdowns = countdowns.filter(item => item.id !== id);
                    saveCountdowns();
                    refresh();
                }
            }
        });

        // ---------- Light / dark toggle ----------
        const themeBtn = document.getElementById("theme-toggle");
        themeBtn.addEventListener("click", () => {
            const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
            document.documentElement.dataset.theme = next;
            try { localStorage.setItem("theme", next); } catch (err) { }
        });

        // ---------- Start ----------
        refresh();
        setInterval(tick, 1000);
    </script>
</body>

</html>
